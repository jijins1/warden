# Configuration golangci-lint.
#
# Sa raison d'être principale est `depguard`, qui tient la moitié de l'ADR-0011
# que le compilateur ne couvre PAS : les rôles serveur sont des paquets frères
# sous le même `internal/`, donc Go les laisse s'importer librement.
#
# Répartition à garder en tête :
#   - frontière de sécurité (runner ↛ control plane) → compilateur, échec de
#     `go build`. Rien ici ne la garde, et rien ici ne peut l'affaiblir.
#   - frontière de conception (arêtes entre rôles, ADR-0006) → ce fichier.
#     Moins solide : ça se contourne avec un `//nolint`. C'est le meilleur cran
#     disponible pour des paquets frères, pas un équivalent du compilateur.
version: "2"

linters:
  enable:
    - depguard
    # Le produit manipule des jetons de run et exécute du code arbitraire :
    # les chemins non nettoyés et les exec mal formés doivent se voir tôt.
    - gosec
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx

  settings:
    depguard:
      rules:
        # ------------------------------------------------------------------
        # Découpage hexagonal du control plane (ADR-0019).
        #
        # Chaque règle est en `lax` : tout est permis sauf ce qui est refusé,
        # et une entrée `allow` plus spécifique l'emporte sur le refus. D'où la
        # forme retenue — refuser TOUT `internal/server/internal`, puis
        # ré-autoriser la seule arête légitime.
        #
        # Le graphe visé tient en trois flèches :
        #     core      -> rien
        #     inbound   -> core
        #     outbound  -> core        (pour les types du domaine)
        # et `cmd/wardend` seul connaît les deux côtés.
        #
        # Conséquence voulue : un NOUVEL adaptateur est refusé partout par
        # défaut, sauf à atteindre le cœur. Il ne peut pas se brancher en
        # silence sur un de ses pairs.
        # ------------------------------------------------------------------
        coeur:
          list-mode: lax
          files:
            - "**/internal/server/internal/core/**"
          deny:
            # Le cœur ne connaît AUCUNE infrastructure. C'est ce qui rend le
            # test de niveau 2 de l'ADR-0010 possible sans cluster.
            - pkg: database/sql
              desc: "ADR-0019 : le cœur ne parle pas à une base. Le port est déclaré ici, l'adaptateur vit dans outbound/store."
            - pkg: github.com/jackc
              desc: "ADR-0019 : pilote PostgreSQL — outbound/store, pas le cœur."
            - pkg: k8s.io
              desc: "ADR-0019 : client-go vit dans outbound/orchestrator. L'ADR-0010 a décidé une stratégie de test sans cluster jetable : elle n'est réalisable que si le cœur ne lie pas Kubernetes."
            - pkg: net/http
              desc: "ADR-0019 : le transport appartient aux adaptateurs. Un cœur qui lie net/http a déjà commencé à décider de sa propre interface."
            - pkg: os/exec
              desc: "ADR-0005 / ADR-0019 : le binaire git s'appelle depuis le socle `internal/git`, jamais depuis le métier."
            # Et il ne connaît aucun adaptateur : la dépendance pointe vers
            # l'intérieur, jamais l'inverse.
            - pkg: github.com/jijins1/warden/internal/server/internal
              desc: "ADR-0019 : le cœur ne dépend d'aucun adaptateur. L'assemblage a lieu dans cmd/wardend, nulle part ailleurs."
          allow:
            # `core` lui-même, pour le seul cas où ce chemin est atteignable :
            # le paquet de test externe `core_test`, qui doit importer ce qu'il
            # teste. Un fichier de `core` ne peut pas s'importer lui-même.
            #
            # Cette forme plutôt qu'un `!$test` sur la règle : les refus
            # ci-dessus — base de données, client Kubernetes, net/http — doivent
            # rester actifs DANS les tests. Un test du cœur qui a besoin d'une
            # base a cessé d'être un test d'étage 1 (ADR-0010), et c'est
            # exactement ce que cette règle doit continuer de dire.
            - github.com/jijins1/warden/internal/server/internal/core

        # `!$test` sur les deux règles frères : un test d'intégration câble
        # légitimement deux adaptateurs — écrire avec `store` pour relire avec
        # `flux` est précisément ce qu'il doit faire, et c'est ce que fait
        # `cmd/wardend`. Ce que la règle interdit, c'est ce couplage dans le
        # code livré. Les règles de domaine de confiance ci-dessous, elles, ne
        # sont PAS relâchées sur les tests.
        serveur-entrants:
          list-mode: lax
          files:
            - "**/internal/server/internal/inbound/**"
            - "!$test"
          deny:
            - pkg: github.com/jijins1/warden/internal/server/internal
              desc: "ADR-0019 : un adaptateur entrant appelle le cœur et rien d'autre. En particulier `ingest` ne touche pas `outbound/store` directement — sinon la table d'events redevient une dépendance publique."
          allow:
            - github.com/jijins1/warden/internal/server/internal/core

        serveur-sortants:
          list-mode: lax
          files:
            - "**/internal/server/internal/outbound/**"
            - "!$test"
          deny:
            - pkg: github.com/jijins1/warden/internal/server/internal
              desc: "ADR-0019 : un adaptateur sortant n'importe que le cœur, pour ses types de domaine. Deux adaptateurs qui se parlent recréent le couplage que la décomposition supprime — y compris store et flux, séparés exprès (ADR-0008)."
          allow:
            - github.com/jijins1/warden/internal/server/internal/core

        # `gitd` n'est pas un adaptateur : c'est un service distinct, qui sert le
        # protocole git aux runners sans passer par le cœur, et que le cœur
        # atteint dans l'autre sens par outbound/gitclient (ADR-0006, ADR-0019).
        serveur-gitd:
          list-mode: lax
          files:
            - "**/internal/server/internal/gitd/**"
          deny:
            - pkg: github.com/jijins1/warden/internal/server/internal
              desc: "ADR-0006 : arêtes de `gitd` limitées à outbound/store (et au socle internal/git, hors de ce périmètre). Il n'importe pas le cœur : la quarantaine, l'ancestry et la promotion sont SES règles, pas celles du run."
          allow:
            - github.com/jijins1/warden/internal/server/internal/outbound/store

        # ------------------------------------------------------------------
        # Domaine hostile (ADR-0011).
        #
        # Le compilateur interdit déjà `internal/server/internal/...`. Ce qu'il
        # laisse passer et qui compte quand même :
        #   - le paquet `internal/server` LUI-MÊME, qui n'est pas sous un
        #     `internal/` imbriqué (dette explicitement notée à l'ADR-0011) ;
        #   - `wire/ws`, dont la scission d'avec `wire/ingest` n'a de sens que
        #     si le pod hostile ne lie effectivement jamais le protocole WS.
        # ------------------------------------------------------------------
        domaine-runner:
          list-mode: lax
          files:
            - "**/internal/runner/**"
          deny:
            - pkg: github.com/jijins1/warden/internal/server
              desc: "ADR-0011 : le binaire du pod runner est lisible par un adversaire (§2). Il ne lie aucun code du control plane, y compris le paquet `server` racine."
            - pkg: github.com/jijins1/warden/internal/cli
              desc: "ADR-0011 : domaines de confiance distincts."
            - pkg: github.com/jijins1/warden/internal/wire/ws
              desc: "ADR-0011 : `wire` est scindé pour que le pod hostile ne lie pas le protocole WS du control plane. Le runner ne parle qu'à l'ingestion (wire/ingest)."

        domaine-cli:
          list-mode: lax
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/jijins1/warden/internal/server
              desc: "ADR-0011 : la CLI ne lie pas le control plane, y compris le paquet `server` racine."
            - pkg: github.com/jijins1/warden/internal/runner
              desc: "ADR-0011 : domaines de confiance distincts."
            - pkg: github.com/jijins1/warden/internal/wire/ingest
              desc: "ADR-0008 : l'ingestion est un contrat runner → serveur. La CLI n'y a rien à faire."

        # ------------------------------------------------------------------
        # Socle partagé (ADR-0011).
        #
        # Il est lié par les TROIS binaires : ce qui entre ici entre dans
        # l'image du pod hostile.
        # ------------------------------------------------------------------
        socle-git:
          list-mode: lax
          files:
            - "**/internal/git/**"
          deny:
            # Refus total, sans `allow` : `internal/git` est l'enveloppe du
            # binaire git et RIEN d'autre (ADR-0011). Ni quarantaine, ni
            # promotion, ni ancestry, ni scan de secrets. La première ligne de
            # règle métier qui apparaît ici commence par un import — et c'est
            # celui-là qu'on veut voir échouer.
            - pkg: github.com/jijins1/warden/internal
              desc: "ADR-0011 : `internal/git` ne contient aucune règle métier et ne dépend d'aucun paquet du produit. Enveloppe du binaire git, rien d'autre."

        socle-autres:
          list-mode: lax
          files:
            - "**/internal/config/**"
            - "**/internal/events/**"
            - "**/internal/wire/**"
          deny:
            - pkg: github.com/jijins1/warden/internal/server
              desc: "ADR-0011 : le socle est lié par les trois binaires. Il ne peut pas dépendre d'un domaine, sinon la scission ne vaut plus rien."
            - pkg: github.com/jijins1/warden/internal/cli
              desc: "ADR-0011 : le socle ne dépend d'aucun domaine."
            - pkg: github.com/jijins1/warden/internal/runner
              desc: "ADR-0011 : le socle ne dépend d'aucun domaine."
            - pkg: github.com/jijins1/warden/internal/server/internal/core
              desc: "ADR-0009 : `config` ANALYSE, il ne DÉCIDE pas. La composition politique serveur → configuration du commit → flags appartient au cœur, jamais l'inverse."

        # ------------------------------------------------------------------
        # Mains minces (ADR-0011). Le compilateur les empêche déjà d'atteindre
        # les internes de leur domaine ; cette règle vise l'autre dérive, celle
        # d'un `main` qui se met à assembler le produit lui-même.
        # ------------------------------------------------------------------
        mains:
          list-mode: lax
          files:
            - "**/cmd/**"
          deny:
            - pkg: github.com/jijins1/warden/internal/git
              desc: "ADR-0011 : les `main` restent minces. Le socle s'atteint depuis le domaine, pas depuis cmd/."
            - pkg: github.com/jijins1/warden/internal/config
              desc: "ADR-0009 : un `main` qui lit la configuration est le premier pas vers une configuration résolue ailleurs que depuis l'arbre du commit."
            - pkg: github.com/jijins1/warden/internal/wire
              desc: "ADR-0011 : les `main` restent minces."

  exclusions:
    rules:
      # Les tests ont le droit de contourner ce que gosec surveille en
      # production : fichiers temporaires, permissions larges, exec de fixtures.
      - path: _test\.go
        linters:
          - gosec
