<span class="chip" [attr.data-jeton]="jeton()">
  <svg class="icone" viewBox="0 0 12 12" aria-hidden="true">
    @switch (state()) {
      @case ('running') {
        <circle cx="6" cy="6" r="4" fill="currentColor" />
      }
      @case ('interrupted') {
        <rect x="3.2" y="3.2" width="5.6" height="5.6" rx="1" fill="currentColor" />
      }
      @case ('changed') {
        <path d="M6 1.6l4.4 4.4L6 10.4 1.6 6z" fill="currentColor" />
      }
      @case ('failed') {
        <path d="M3.2 3.2l5.6 5.6M8.8 3.2l-5.6 5.6" stroke="currentColor"
              stroke-width="1.8" fill="none" stroke-linecap="round" />
      }
      @case ('unreachable') {
        <circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.5" fill="none" />
        <path d="M3 9l6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      }
      @case ('skipped') {
        <path d="M3 3l3.4 3-3.4 3M7 3l3.4 3L7 9" stroke="currentColor"
              stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      }
      @case ('unknown') {
        <path d="M4.4 4.4a1.7 1.7 0 113 1.1c-.6.5-1.1.8-1.1 1.6" stroke="currentColor"
              stroke-width="1.5" fill="none" stroke-linecap="round" />
        <circle cx="6.2" cy="9.2" r=".9" fill="currentColor" />
      }
      @default {
        <path d="M2.5 6.2l2.4 2.4L9.6 3.9" stroke="currentColor" stroke-width="1.8"
              fill="none" stroke-linecap="round" stroke-linejoin="round" />
      }
    }
  </svg>
  <span class="mot">{{ libelle() }}</span>
</span>

@if (causeAffichee(); as cause) {
  <span class="cause" [class.forte]="causeForte()">{{ cause }}</span>
}
