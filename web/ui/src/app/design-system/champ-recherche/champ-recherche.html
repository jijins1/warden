<label class="w-search">
  <svg viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6" fill="none" />
    <path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  </svg>
  <input
    #champ
    type="search"
    spellcheck="false"
    autocomplete="off"
    [value]="texte()"
    [placeholder]="placeholder()"
    [attr.aria-label]="libelle()"
    aria-keyshortcuts="/"
    (input)="saisir(champ.value)"
    (keydown.enter)="valider(champ.value)" />
  <span class="w-kbd" aria-hidden="true">/</span>
</label>
