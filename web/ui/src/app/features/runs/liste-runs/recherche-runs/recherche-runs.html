<w-page-recherche>
  <w-page-recherche-titre>Runs</w-page-recherche-titre>
  <w-page-recherche-perimetre>
    Yours, and every run on the environments you have access to. Being an administrator does
    not widen it.
  </w-page-recherche-perimetre>

  <w-page-recherche-action>
    <a class="w-btn w-btn--primary" routerLink="/runs/new">Launch run</a>
  </w-page-recherche-action>

  <w-page-recherche-outils>
    <w-filtres-runs [filtre]="filtre()" (changement)="appliquer($event)" />
    <w-filtre-environnement [actif]="environnementActif()" (choix)="appliquer({ env: $event })" />
    <span class="w-spacer"></span>
    <span class="w-shown">{{ nombreAffiches() }} shown</span>
  </w-page-recherche-outils>

  <w-page-recherche-filtres>
    <w-filtres-actifs [filtre]="filtre()" (changement)="appliquer($event)" (effacement)="effacer()" />
  </w-page-recherche-filtres>

  <w-page-recherche-resultats>
    <w-resultats-runs
      [etat]="etat()"
      [filtrePose]="filtrePose()"
      (nouvelEssai)="recharger()"
      (effacement)="effacer()" />
  </w-page-recherche-resultats>

  <w-page-recherche-pagination>
    @if (avecResultats()) {
      <w-pagination [reste]="reste()" [chargement]="chargement()" (suite)="suivante()" />
    }
  </w-page-recherche-pagination>
</w-page-recherche>
