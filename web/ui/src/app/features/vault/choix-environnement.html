<div class="segments" role="group" aria-label="Environment">
  @for (env of environnements(); track env) {
    <button
      type="button"
      class="w-mono"
      [class.actif]="env === selection()"
      [attr.aria-pressed]="env === selection()"
      (click)="choisi.emit(env)">
      {{ env }}
    </button>
  }
</div>
