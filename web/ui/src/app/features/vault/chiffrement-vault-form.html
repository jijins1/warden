<form class="formulaire" [formGroup]="formulaire" (ngSubmit)="soumettre()">
  <mat-form-field appearance="outline">
    <mat-label>Variable name</mat-label>
    <input matInput formControlName="var_name" class="w-mono" />
    @if (formulaire.controls.var_name.hasError('pattern')) {
      <mat-error>Letters, digits and underscores, not starting with a digit.</mat-error>
    }
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Value</mat-label>
    <textarea
      matInput
      formControlName="plaintext"
      class="w-mono"
      rows="3"
      autocomplete="off"
      spellcheck="false"></textarea>
  </mat-form-field>

  <button mat-flat-button type="submit" [disabled]="envoiImpossible()">
    {{ enCours() ? 'Encrypting…' : 'Encrypt' }}
  </button>
</form>
