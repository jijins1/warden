<section class="page">
  <header class="entete">
    <h1>Vault keys</h1>
    <p class="sous-titre">
      The Ansible Vault password of each environment you have access to. It is
      handed to the runner at run time and never shown back, here or anywhere.
    </p>
  </header>

  <w-vault-environnements [selection]="environment()" />

  @if (environment(); as env) {
    <div class="blocs">
      <w-vault-cle [environnement]="env" />
      <w-vault-chiffrement [environnement]="env" />
    </div>
  }
</section>
