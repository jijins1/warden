<section class="carte" aria-labelledby="titre-cle">
  <h2 id="titre-cle">Key</h2>

  @if (!charge()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <w-descripteur-cle-vault [descripteur]="descripteur()" />

    @if (erreur(); as message) {
      <p class="erreur" role="alert">
        <mat-icon>error_outline</mat-icon><span>{{ message }}</span>
      </p>
    }

    <w-pose-cle-vault-form
      [rotation]="existe()"
      [enCours]="enCours()"
      (posee)="poser($event)" />
  }
</section>
