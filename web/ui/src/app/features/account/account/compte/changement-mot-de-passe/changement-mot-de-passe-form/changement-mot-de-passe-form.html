<form class="w-card w-form" [formGroup]="formulaire" (ngSubmit)="soumettre()">
  <h2>Change password</h2>

  <p class="w-callout w-callout--cap">
    <mat-icon>logout</mat-icon>
    <span>
      Changing it <strong>signs you out everywhere</strong>, including here. That
      is the point: a password changed because it may be compromised has to cut
      the sessions opened with it.
    </span>
  </p>

  <div class="w-field">
    <label for="mot-de-passe-actuel">Current password</label>
    <input
      id="mot-de-passe-actuel"
      class="w-input"
      type="password"
      formControlName="actuel"
      autocomplete="current-password" />
  </div>

  <div class="w-field">
    <label for="mot-de-passe-nouveau">New password</label>
    <input
      id="mot-de-passe-nouveau"
      class="w-input"
      type="password"
      formControlName="nouveau"
      autocomplete="new-password" />
  </div>

  @if (erreur(); as message) {
    <p class="w-callout w-callout--error" role="alert">
      <mat-icon>error_outline</mat-icon>
      <span>{{ message }}</span>
    </p>
  }

  <div class="w-form-actions">
    <button class="w-btn w-btn--primary" type="submit" [disabled]="envoiImpossible()">
      {{ libelleBouton() }}
    </button>
  </div>
</form>
