<form class="bloc" [formGroup]="formulaire" (ngSubmit)="soumettre()">
  <h2>Change password</h2>

  <p class="avertissement">
    <mat-icon>logout</mat-icon>
    <span>
      Changing it <strong>signs you out everywhere</strong>, including here. That
      is the point: a password changed because it may be compromised has to cut
      the sessions opened with it.
    </span>
  </p>

  <mat-form-field appearance="outline">
    <mat-label>Current password</mat-label>
    <input matInput type="password" formControlName="current" autocomplete="current-password" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>New password</mat-label>
    <input matInput type="password" formControlName="nouveau" autocomplete="new-password" />
  </mat-form-field>

  @if (erreur(); as message) {
    <p class="erreur" role="alert">
      <mat-icon>error_outline</mat-icon><span>{{ message }}</span>
    </p>
  }

  <button mat-flat-button type="submit" [disabled]="formulaire.invalid || enCours()">
    {{ enCours() ? 'Changing…' : 'Change password' }}
  </button>
</form>
