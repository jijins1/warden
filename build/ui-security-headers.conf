# Les en-têtes de sécurité, dans UN fragment inclus par chaque `location`.
#
# Pas par discipline de facteurisation : `add_header` cesse d'être hérité dès
# qu'un bloc enfant en déclare un seul. Les écrire au niveau `server` puis
# ajouter un `Cache-Control` dans une `location` fait donc SILENCIEUSEMENT
# tomber tous les autres — c'est arrivé, et ça n'a été vu qu'en interrogeant
# l'image. Un `include` rend l'oubli impossible au lieu d'improbable.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# `script-src 'self'` SANS exception : le build désactive l'inlining du CSS
# critique, qui posait un gestionnaire `onload=` sur le <link>.
#
# `style-src` garde `'unsafe-inline'` parce qu'Angular injecte les styles de
# composant à l'exécution. Le rendre strict demande un nonce par réponse
# (`ngCspNonce`) : c'est la suite, et c'est dit plutôt que tu.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ${WARDEN_CONNECT_SRC}; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
