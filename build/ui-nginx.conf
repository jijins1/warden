# nginx pour l'interface warden.
#
# Ce fichier est le DÉFAUT de l'image ; le chart le remplace par une ConfigMap
# pour injecter l'origine de l'API dans `connect-src` — une image ne peut pas
# connaître l'hôte du déploiement qui l'utilisera.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/warden-security-headers.conf;

    # Le repli SPA. C'est LUI qui fait qu'un lien profond rechargé fonctionne :
    # `/runs/01J…` n'a aucun fichier derrière, et sans cette ligne le serveur
    # répondrait 404 sur la fonction première de l'interface.
    location / {
        include /etc/nginx/warden-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers portent un hachage dans leur nom : leur contenu ne change
    # jamais sous une même URL. UN seul `Cache-Control` — `expires` en émettrait
    # un seond, et deux valeurs pour une même directive laissent le cache
    # choisir.
    #
    # PAS de `always` sur CETTE directive : avec lui, un 404 transitoire —
    # une requête tombée sur un pod pas encore à jour pendant un rollout —
    # partirait avec "immutable, max-age=31536000", et un cache en amont
    # (Cloudflare) figerait l'erreur pour un an au lieu de la retenter. Sans
    # `always`, nginx n'ajoute l'en-tête que sur un succès (2xx/3xx) ; un 404
    # reste donc non caché et sera retenté normalement.
    location ~* \.(js|css|woff2|ttf|svg|png|ico)$ {
        include /etc/nginx/warden-security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Jamais en cache : `index.html` porte les noms hachés du moment,
    # `config.json` l'adresse de l'API. Un cache sur eux servirait l'ancienne
    # application après un déploiement, ou l'adresse d'un autre environnement
    # après une promotion.
    location = /index.html {
        include /etc/nginx/warden-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /config.json {
        include /etc/nginx/warden-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
