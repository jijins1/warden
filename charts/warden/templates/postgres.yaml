{{- if .Values.postgres.enabled }}
# PostgreSQL par l'opérateur CNPG.
#
# L'ADR-0008 fait de PostgreSQL le journal ET le transport des events : ce n'est
# pas une base de côté, c'est le composant dont la disponibilité conditionne le
# streaming. Confier son cycle de vie à un opérateur plutôt qu'à un StatefulSet
# écrit à la main, c'est ne pas réimplémenter les sauvegardes, le basculement et
# les montées de version — dans l'esprit du §10.2, « ne pas réimplémenter,
# intégrer ».
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "warden.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warden.labels" (dict "component" "database" "root" .) | nindent 4 }}
  annotations:
    # La base SURVIT à la désinstallation, même raison que le PVC des dépôts :
    # l'ADR-0008 fait de PostgreSQL le JOURNAL, pas un cache. Un `helm uninstall`
    # qui l'emporterait détruirait l'audit de tous les runs passés. La supprimer
    # reste possible, mais à la main et donc en le voulant.
    helm.sh/resource-policy: keep
spec:
  instances: {{ .Values.postgres.instances }}

  bootstrap:
    initdb:
      database: warden
      owner: warden

  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    # Explicite alors que le cluster a une classe par défaut : il en a même DEUX
    # marquées `(default)`, ce qui rend le choix implicite indéterminé. Nommer la
    # classe est ici la seule façon de savoir ce qu'on obtient.
    storageClass: {{ . }}
    {{- end }}

  {{- if .Values.postgres.backup.enabled }}
  # Le plugin archive les WAL en continu : une restauration peut viser n'importe
  # quel instant, pas seulement la dernière sauvegarde complète.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ required "postgres.backup.objectStoreName est requis quand postgres.backup.enabled=true" .Values.postgres.backup.objectStoreName | quote }}
  {{- end }}

  # CNPG publie les credentials dans un Secret `<cluster>-app`, dont la clé `uri`
  # est directement la chaîne de connexion attendue par le produit. Rien à
  # recopier, donc rien à désynchroniser.

  # Les rôles de l'ADR-0008 sont déclarés à l'OPÉRATEUR, pas créés par la
  # migration.
  #
  # La migration 00001 sait les créer, mais l'utilisateur applicatif de CNPG n'a
  # pas `CREATEROLE` — et le lui donner serait pire que le problème : dans
  # PostgreSQL, `CREATEROLE` permet de se doter de droits qu'on n'a pas. Les
  # déclarer ici les fait créer par un rôle qui a déjà l'autorité, et le bloc
  # idempotent de la migration devient un no-op.
  #
  # Les trois existent pour séparer les accès (ADR-0008) : l'ingestion n'a que
  # INSERT, et les payloads `--diff` sont sous contrôle d'accès distinct parce
  # qu'ils contiennent les secrets rendus (§6.5).
  managed:
    roles:
      - name: warden_ingest
        ensure: present
        login: false
      - name: warden_reader
        ensure: present
        login: false
      - name: warden_diff_reader
        ensure: present
        login: false
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "warden.fullname" . }}-db-daily
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warden.labels" (dict "component" "database" "root" .) | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  # Une première sauvegarde dès la création : sans elle, les WAL archivés
  # n'ont aucune base à laquelle se rejouer avant la première nuit.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ include "warden.fullname" . }}-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}
