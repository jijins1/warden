{{- if .Values.ingress.enabled }}
{{- $fullname := include "warden.fullname" . -}}
# Entrées depuis les postes de développement.
#
# DEUX hôtes et non un, parce que la CLI parle à deux surfaces qui n'ont ni le
# même protocole ni la même politique : l'API en JSON, et le smart HTTP de git en
# écriture. Les mettre derrière un même hôte à des chemins différents rendrait
# leur restriction indissociable — or c'est précisément la séparation par port
# qui rend chaque surface restreignable (ADR-0027).
#
# Le canal de dispatch et le port de LECTURE du rôle `git` ne sont PAS exposés :
# ils sont joints par les pods runner, depuis l'intérieur du cluster. Les publier
# ouvrirait à Internet les deux surfaces que l'ADR-0007 réserve au domaine
# hostile — et la seule qui distribue des credentials.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warden.labels" (dict "component" "api" "root" .) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api
                port: { number: {{ include "warden.port.api" . }} }
  {{- with .Values.ingress.api.tlsSecret }}
  tls:
    - hosts: [{{ $.Values.ingress.api.host | quote }}]
      secretName: {{ . }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-git
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warden.labels" (dict "component" "git" "root" .) | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.git.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.git.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-git-push
                port: { number: {{ include "warden.port.gitPush" . }} }
  {{- with .Values.ingress.git.tlsSecret }}
  tls:
    - hosts: [{{ $.Values.ingress.git.host | quote }}]
      secretName: {{ . }}
  {{- end }}
{{- end }}
{{- $unique := include "warden.origineUnique" . -}}
{{- if and .Values.ingress.enabled .Values.ui.enabled .Values.ingress.ui.host }}
{{- $fullname := include "warden.fullname" . }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warden.labels" (dict "component" "ui" "root" .) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.ui.host }}
      http:
        paths:
          {{- with $unique }}
          # L'API, SUR L'HÔTE DE L'INTERFACE. Elle reste servie à la racine de
          # son propre hôte pour la CLI : ce chemin-ci n'existe que pour mettre
          # le navigateur en MÊME ORIGINE que la SPA, ce qui retire le CORS et
          # la contrainte de domaine enregistrable commun de l'ADR-0035.
          #
          # Le préfixe n'est PAS retiré ici : le serveur se monte lui-même aux
          # deux endroits (`WARDEN_API_BASE_PATH`), ce qui évite de lier la
          # chart au middleware d'un contrôleur d'ingress particulier.
          - path: /{{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api
                port: { number: {{ include "warden.port.api" $ }} }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-ui
                port: { number: {{ include "warden.port.ui" . }} }
  {{- with .Values.ingress.ui.tlsSecret }}
  tls:
    - hosts: [{{ $.Values.ingress.ui.host | quote }}]
      secretName: {{ . }}
  {{- end }}
{{- end }}
