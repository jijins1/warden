# Valeurs par défaut de warden.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ CE QUI N'EST PAS ICI EST DÉLIBÉRÉMENT ABSENT.                            │
# │                                                                          │
# │ Une valeur de chart est une chose qu'un déploiement peut se tromper à    │
# │ régler. En ajouter une sur un contrôle de sécurité, c'est ajouter une    │
# │ façon de le désactiver en silence — et personne ne relit un `values.yaml`│
# │ pour vérifier qu'un contrôle est toujours actif.                         │
# │                                                                          │
# │ Ne sont donc PAS configurables, et la liste est fermée :                 │
# │                                                                          │
# │   - les règles RBAC. Le rôle `api` crée des pods, le `controller` ne     │
# │     peut que les lister et les détruire, et son `delete` seul sur les    │
# │     Secrets l'empêche d'en LIRE un (ADR-0023) ;                          │
# │   - les `securityContext` : non-root, racine en lecture seule,           │
# │     capacités retirées, seccomp ;                                        │
# │   - `automountServiceAccountToken: false` là où il est posé ;            │
# │   - la SÉPARATION PAR PORT du rôle `git` — 8081 interne, 8082 écriture,  │
# │     8083 lecture. C'est elle qui rend chaque surface restreignable par   │
# │     NetworkPolicy (ADR-0024, ADR-0027) ; les rendre réglables permettrait│
# │     d'en faire collisionner deux ;                                       │
# │   - `ingress: []` sur les pods runner ;                                  │
# │   - la stratégie `Recreate` de `git` et de `controller`, et leur unique  │
# │     réplica. Voir plus bas pourquoi ce ne sont pas des réglages.         │
# └──────────────────────────────────────────────────────────────────────────┘

# -- Remplace le nom de la release dans les noms de ressources.
nameOverride: ""
fullnameOverride: ""

# Le Namespace.
#
# ArgoCD sait le créer lui-même avec `CreateNamespace=true` ; dans ce cas, poser
# `create: false`. Le défaut reproduit le comportement des manifestes d'origine,
# qui portaient leur propre Namespace.
namespace:
  create: true

image:
  # Le registre des TROIS images, et elles n'en ont qu'un.
  #
  # Le code, la CI et les images vivent sur la même plateforme : `origin` est
  # GitHub, donc `GITHUB_TOKEN` suffit à publier et aucun identifiant de longue
  # durée n'a à être stocké. Publier ailleurs demanderait d'en déposer un dans
  # les secrets du dépôt, ce qui ajoute un secret à faire tourner sans rien
  # acheter.
  registry: ghcr.io/jijins1
  # Le control plane : un seul binaire pour les trois rôles (ADR-0006).
  wardend: wardend
  # L'image du pod runner, REMISE au pod et jamais utilisée par le serveur.
  runner: warden-runner
  # L'interface web : un nginx qui sert des fichiers statiques (ADR-0035).
  ui: warden-ui
  # Vide, `.Chart.AppVersion` s'applique.
  tag: ""
  pullPolicy: IfNotPresent

  # Les Secrets de tirage, À POSER AVANT l'installation quand le registre est
  # privé — ce qu'un package GHCR est par défaut :
  #
  #   kubectl create secret docker-registry ghcr-pull-secret -n <ns> \
  #     --docker-server=ghcr.io --docker-username=<compte> \
  #     --docker-password=<jeton avec read:packages>
  #
  # Vide sur un registre public, où l'ajouter ne ferait qu'exposer un jeton de
  # plus au cluster.
  pullSecrets: []

ui:
  # L'interface web. Désactivable : un déploiement piloté uniquement à la CLI
  # reste parfaitement valide, et ne rien servir est plus sûr que servir une
  # origine dont personne ne se sert.
  enabled: true

  # N réplicas sans réserve, contrairement à l'API : nginx ne sert que des
  # fichiers, il ne tient aucun état et n'a aucun canal épinglé.
  replicas: 2

  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

api:
  # UN réplica par défaut, et ce n'est pas un plafond mais un aveu : N > 1 n'a
  # jamais été vérifié. Le canal de dispatch (ADR-0018) est tenu par UN pod, et
  # rien ne garantit aujourd'hui qu'un runner atteigne celui qui a construit son
  # ordre. Monter ce chiffre avant d'avoir mesuré, c'est parier.
  replicas: 1

  # Validité d'une session `warden login`, en HEURES.
  #
  # Le curseur est mis du côté de l'usage parce que la révocation existe :
  # `warden logout`, la désactivation d'un compte et le changement de mot de
  # passe coupent toutes les sessions immédiatement.
  sessionTtlHours: 720

  # Adresse du rôle `git` ANNONCÉE à la CLI avec son jeton de push (ADR-0034).
  #
  # Elle doit être joignable DEPUIS LE POSTE de l'utilisateur — c'est en général
  # l'ingress d'écriture, pas un service interne au cluster. Confondre les deux
  # fait échouer tous les push avec une erreur de résolution DNS chez le client.
  #
  # Vide, le serveur ne l'annonce pas et chaque utilisateur doit poser
  # WARDEN_GIT_URL lui-même.
  gitClientURL: ""

  # Refuser les runs dont le commit ne porte pas `.ansibleproxy.yml`
  # (ADR-0009, ADR-0034).
  #
  # NE PAS ACTIVER avant que tous les dépôts servis aient committé leur fichier :
  # la bascule arrête leurs runs, avec un message qui nomme le fichier mais
  # arrive au pire moment. C'est un interrupteur de MIGRATION, destiné à
  # disparaître une fois la migration faite.
  exigerConfigProjet: false

  # Plafond de durée d'un run, en SECONDES (décision actée n°13).
  #
  # Il devient `activeDeadlineSeconds` sur le pod runner : il arrête donc un run
  # qui pend même si le contrôleur est mort, ce qui en fait la seule protection
  # qui ne dépende d'aucun processus du produit.
  runDeadlineSeconds: 7200

  # Vérification des empreintes SSH par les runs (ADR-0048).
  #
  # Chaque run ne joint que les machines DÉCLARÉES avec leur clé d'hôte
  # (`warden host declare`, ou un enrôlement assisté) ; les autres sont
  # refusées par ssh. `false` coupe la vérification des runs à clé, le temps
  # de compléter les déclarations d'une flotte existante — c'est un
  # interrupteur de TRANSITION. Les runs à mot de passe (`-k`) vérifient
  # toujours.
  verifierEmpreintes: true

  resources: {}

git:
  # PAS de `replicas` : il vaut 1, et ce n'est pas un réglage.
  #
  # Le volume est RWO — deux instances monteraient le même PVC et la seconde
  # resterait bloquée au montage. L'ADR-0006 assume ce point de défaillance
  # unique plutôt qu'un volume partagé dont la cohérence dépendrait du système de
  # fichiers.
  persistence:
    size: 20Gi
    storageClass: local-path
    # Réutiliser un PVC existant plutôt que d'en faire créer un.
    existingClaim: ""
  resources: {}

controller:
  # PAS de `replicas` non plus : 1, faute de leader election par Lease
  # (ADR-0006). Toutes ses actions sont idempotentes, donc deux contrôleurs
  # feraient du travail en double et non du travail faux — mais l'inoffensif
  # repose ici sur une garde SQL, et rien ne gagne à l'éprouver.

  # DEUX rythmes, et ils sont séparés exprès.
  #
  # Les PODS coûtent un LIST à l'API Kubernetes à chaque passage, et ce qu'ils
  # bornent est un retard d'AUDIT : un run tué met une minute à être clos, ce qui
  # ne gêne personne. C'est le réglage qu'on ralentit si le cluster est chargé.
  reconcileSeconds: 30

  # Les DROITS ne coûtent qu'une lecture de fichier et une comparaison de chaîne,
  # et ce qu'ils bornent est le délai de prise d'effet d'une RÉVOCATION. C'est le
  # réglage qu'on accélère.
  #
  # Inutile de descendre plus bas : le kubelet met quelques dizaines de secondes
  # à republier un ConfigMap modifié, et c'est lui qui domine le délai total.
  grantsSeconds: 10

  # Les options par environnement (ADR-0044) ne coûtent, elles aussi, qu'une
  # lecture de fichier. Alignées sur le rythme des DROITS et non sur celui des
  # pods : `allowRun` est un gel qu'un exploitant pose pendant un incident, et
  # ce qu'il borne est le délai de sa PRISE D'EFFET — la même urgence qu'une
  # révocation de droit.
  protectedSeconds: 10

  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Les droits par environnement (§10.2, ADR-0033).
#
# CETTE VALEUR EST LA SOURCE DE VÉRITÉ. Aucune commande du produit ne modifie
# les droits : `warden grant list` les affiche, rien ne les écrit. La seule façon
# d'en changer est de committer ici et de laisser l'outil GitOps synchroniser.
#
# Pour chaque environnement NOMMÉ, la liste fait autorité : un compte retiré est
# RÉVOQUÉ au passage suivant. Un environnement ABSENT n'est PAS touché — ce qui
# permet de découper les droits en plusieurs sources, et évite qu'un document
# tronqué révoque tout.
#
# Un document VIDE est REFUSÉ et journalisé en erreur : « ne rien vouloir » et
# « n'avoir rien pu lire » se ressemblent trop. Pour fermer un environnement,
# écrire une liste vide — c'est un « personne » explicite.
#
# CE QUE CE CONTRÔLE ACHÈTE : obtenir la clé SSH d'un environnement auquel on n'a
# pas droit. CE QU'IL N'ACHÈTE PAS : qu'un run légitime de `staging` joigne une
# machine de `prod`. L'egress du runner est ouvert, et le §10.2 pose que « le
# périmètre est appliqué par le réseau ou il ne l'est pas ».
grants:
  enabled: true
  environments: {}
  # environments:
  #   prod:
  #     - ruokki

# Les options par environnement (ADR-0044) — NI L'UNE NI L'AUTRE n'est un
# contrôle d'accès à un credential. Voir `grants` ci-dessus pour ça.
#
#   protected : un AVERTISSEMENT VISUEL. Avant cet ADR, seul le nom `prod`
#     était reconnu, câblé en dur dans le badge du navigateur. Cette option le
#     remplace : un environnement qui s'appelle autrement peut mériter la
#     même prudence.
#
#   allowRun : un GEL du lancement de run, INDÉPENDANT des droits
#     ci-dessus — `false` refuse tout nouveau run sur cet environnement même
#     pour un compte qui y a droit, sans lui retirer ce droit. Utile pour un
#     gel temporaire (maintenance, incident) qu'on lève sans avoir à
#     réaccorder quoi que ce soit ensuite. Omis, ou `true` : autorisé — le
#     défaut ne bloque jamais silencieusement.
#
# Fichier SÉPARÉ des droits, bien que le mécanisme de réconciliation soit
# identique — les notions sont distinctes, et les mélanger ferait d'un simple
# avertissement ou d'un gel quelque chose qui ressemble à un contrôle de
# sécurité de premier plan.
#
# Contrairement aux droits, une carte VIDE ici est un état accepté : oublier
# de déclarer un environnement ne retire aucun accès, ça laisse juste
# `protected: false` et `allowRun: true` — aucun badge, aucun gel.
protected:
  enabled: true
  environments: {}
  # environments:
  #   prod:
  #     protected: true
  #     allowRun: false   # gel temporaire, ex. pendant une maintenance
  #   preprod:
  #     protected: true

# PostgreSQL par l'opérateur CNPG.
#
# L'ADR-0008 fait de PostgreSQL le journal ET le transport des events : ce n'est
# pas une base de côté, c'est le composant dont la disponibilité conditionne le
# streaming.
postgres:
  # `false` pour brancher une base existante — renseigner alors
  # `database.existingSecret`.
  enabled: true
  instances: 1
  storage:
    size: 10Gi
    # Explicite alors que le cluster a une classe par défaut : il en a même DEUX
    # marquées `(default)`, ce qui rend le choix implicite indéterminé.
    storageClass: local-path

database:
  # Le Secret qui porte la chaîne de connexion. CNPG le publie sous ce nom.
  existingSecret: ""
  key: uri

# Le secret partagé des rôles `api` et `git`.
#
# JAMAIS créé par la chart : un secret dans un dépôt git est un secret publié.
# À poser avant l'installation —
#
#   kubectl create secret generic warden-internal -n <ns> \
#     --from-literal=internal-token="$(openssl rand -base64 32)" \
#     --from-literal=forge-token="<jeton de lecture de la forge>"
internalSecret:
  name: warden-internal
  # Authentifie l'API interne ET signe les jetons de push et de lecture
  # (ADR-0024, ADR-0028) : qui le détient peut frapper une portée arbitraire.
  internalTokenKey: internal-token
  # Lecture sur la forge, pour le rafraîchissement du miroir de la branche
  # protégée (ADR-0028).
  forgeTokenKey: forge-token

networkPolicy:
  # Le fichier qui compte le plus. Sur un cluster où les NetworkPolicy sont
  # acceptées mais IGNORÉES par le CNI, tout fonctionnera à l'identique et rien
  # ne sera confiné — à vérifier plutôt qu'à supposer.
  enabled: true

ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: traefik-middleware-redirect-https@kubernetescrd

  # TROIS hôtes : l'API, l'écriture git, et l'interface.
  #
  # CONTRAINTE DE L'ADR-0035, et elle n'est pas négociable : `ui.host` et
  # `api.host` doivent partager le même DOMAINE ENREGISTRABLE
  # (`warden-ui.example.com` et `warden.example.com` → `example.com`). Ils sont
  # alors « same-site » bien que d'origines distinctes, et le cookie de session
  # `SameSite=Strict` part. Sur deux domaines enregistrables différents il ne
  # partirait pas du tout : personne ne resterait connecté, et rien dans les logs
  # ne dirait pourquoi.
  ui:
    host: ""
    tlsSecret: ""

    # LE CHEMIN SOUS LEQUEL L'HÔTE DE L'INTERFACE ROUTE VERS L'API.
    #
    # L'API est alors jointe DEUX FOIS, et c'est voulu :
    #
    #   - à la racine de son propre hôte, par la CLI. Rien ne bouge de ce
    #     côté : aucun `WARDEN_SERVER` à rééditer, aucun `.ansibleproxy.yml`,
    #     aucune session à rouvrir ;
    #
    #   - sous ce chemin, sur l'hôte de l'INTERFACE, par le navigateur. L'API
    #     est alors en MÊME ORIGINE que la SPA.
    #
    # CE QUE ÇA ACHÈTE : le CORS et le durcissement de `CheckOrigin` deviennent
    # inutiles, et surtout la contrainte de l'ADR-0035 — les deux hôtes sur un
    # même domaine enregistrable — disparaît. C'est elle qui comptait : sa
    # violation était SILENCIEUSE, le cookie `SameSite=Strict` ne partait pas,
    # personne ne restait connecté, et rien dans les logs ne le disait.
    #
    # VIDE, l'interface appelle l'API sur son hôte à elle : c'est le déploiement
    # à deux origines, avec la contrainte ci-dessus à respecter à la main.
    apiPath: /api

  # DEUX hôtes et non un, parce que la CLI parle à deux surfaces qui n'ont ni le
  # même protocole ni la même politique. Les mettre derrière un même hôte à des
  # chemins différents rendrait leur restriction indissociable.
  #
  # Le canal de dispatch et le port de LECTURE de `git` ne sont PAS exposés : ils
  # sont joints par les pods runner, depuis l'intérieur du cluster. Les publier
  # ouvrirait à Internet les deux surfaces que l'ADR-0007 réserve au domaine
  # hostile — et la seule qui distribue des credentials.
  api:
    host: warden-dev.ruokki.ovh
    tlsSecret: warden-api-cert-tls

  git:
    host: warden-git-dev.ruokki.ovh
    tlsSecret: warden-git-cert-tls
    annotations:
      # Un push d'audit transporte l'historique local manquant, et l'ADR-0003
      # note que ce coût n'est pas borné — le modèle simplifié en a même fait le
      # cas NORMAL. Un plafond de corps par défaut couperait les pushes
      # ordinaires.
      traefik.ingress.kubernetes.io/router.middlewares.buffering: ""

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ CIBLE DE TEST. N'A RIEN À FAIRE EN PRODUCTION — d'où le défaut `false`.  │
# │                                                                          │
# │ Un pod qui sert un sshd acceptant le MOT DE PASSE, ce qu'aucune machine  │
# │ gérée ne devrait faire au-delà de son enrôlement. Il existe pour qu'un   │
# │ `warden enroll` ait quelque chose à enrôler dans un cluster de           │
# │ développement, et pour rien d'autre.                                     │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Sa clé d'hôte est frappée à chaque démarrage : la RECRÉER change son empreinte,
# et un réenrôlement échouera alors sur `ErrEmpreinteChangee` — comportement
# voulu, et bonne façon de vérifier que l'épinglage fonctionne pour de vrai.
#
# Le mot de passe n'est pas dans la chart, même raison que le secret interne :
#   kubectl create secret generic warden-cible-enrolement -n <ns> \
#     --from-literal=password="$(openssl rand -base64 24)"
testTargets:
  enabled: false

  # Image par défaut de toutes les cibles. Celle-ci porte Python, sans quoi
  # Ansible ne peut exécuter aucun module dessus.
  image: warden-cible-playbook

  # SON REGISTRE ET SON TAG, séparés de ceux du produit — et c'est une
  # description, pas une préférence.
  #
  # Cette image n'est PAS construite par ce dépôt : elle n'a ni cible `make` ni
  # job de CI, et `build/cible.Dockerfile` part lui-même d'une image d'enrôlement
  # publiée ailleurs. Elle ne suit donc ni le registre ni la VERSION du produit,
  # et l'aligner de force ferait pointer les cibles vers une image inexistante.
  #
  # Vides, celles du produit s'appliquent.
  registry: ""
  tag: ""

  passwordKey: password

  # Une entrée par cible. La CLÉ du map devient le suffixe du nom :
  # `enrolement` donne `warden-cible-enrolement`.
  #
  # NE PAS RENOMMER une clé existante. Le nom est celui du Deployment, donc le
  # renommer détruit le pod et en crée un autre — avec une clé d'hôte neuve, et
  # un enrôlement épinglé sur l'ancienne qui échouera sur `ErrEmpreinteChangee`.
  #
  # Chaque cible accepte `existingSecret` (défaut : son propre nom) et `image`.
  targets: {}
  # targets:
  #   enrolement: {}
  #   test:
  #     existingSecret: warden-cible-test
