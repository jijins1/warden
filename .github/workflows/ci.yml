# Intégration continue — étapes 1 et 2 de l'ADR-0010.
#
# L'étape 3 (bout en bout : cold start §12 phase 0, egress du runner ADR-0007,
# run tué brutalement §6.4) est DÉLIBÉRÉMENT ABSENT de ce workflow : il exige le
# cluster k3s réel, qui n'est pas joignable depuis un runner GitHub hébergé. Il
# fera l'objet d'un workflow distinct sur runner self-hosted. Le remplacer ici
# par un cluster jetable donnerait des résultats faux — voir l'ADR-0010.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # La version vient de go.mod : une seule source de vérité.
          go-version-file: go.mod

      - name: Formatage
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"; echo "$unformatted"; exit 1
          fi

      - name: go.mod à jour
        run: |
          go mod tidy
          if ! git diff --quiet; then
            echo "go mod tidy produit un diff — committer le résultat :"
            git diff --stat
            exit 1
          fi

      # `go build` est aussi ce qui applique les frontières entre domaines de
      # confiance : un import de `internal/server/internal/...` depuis
      # `internal/runner` est une erreur de compilation (ADR-0011).
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Compilation croisée de la CLI
        # La CLI s'exécute sur la machine de l'utilisateur : elle doit rester
        # portable, et une régression de portabilité doit se voir tout de suite.
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "→ $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/warden
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Ce job tient les arrêts entre rôles serveur de l'ADR-0006, que le
      # compilateur ne couvre PAS : `api`, `gitd`, `controller` et `ingest` sont
      # frères sous le même `internal/`, donc mutuellement visibles. Voir
      # l'en-tête de .golangci.yml.
      #
      # La version est figée : `latest` ferait apparaître des erreurs sur des
      # branches qui n'ont pas bougé, à chaque publication d'un linter.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    name: Tests — étape 1 (unitaire)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Propriété à tenir (ADR-0011) : cet étape ne réclame ni Docker ni
      # cluster. S'il se met à en avoir besoin, c'est qu'un test a glissé
      # d'étape.
      - name: go test
        run: go test -race ./...

  integration:
    name: Tests — étape 2 (intégration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # PostgreSQL vient de testcontainers, pas d'un service déclaré ici : le
      # même chemin de code sert en local et en CI (ADR-0010). Le démon Docker
      # des runners hébergés suffit.
      - name: Binaires envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path)" >> "$GITHUB_ENV"

      - name: go test -tags=integration
        run: go test -race -tags=integration ./...

  # ============================================================================
  # UI Build Job
  # ============================================================================
  ui-build:
    name: Build UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # Only run on main branch or PRs that modify UI files
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'ui') || contains(fromJson('[' + github.event.pull_request.body + ']'), 'ui')
    
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      # Install UI dependencies
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      # Lint UI
      - name: Lint UI
        working-directory: ui
        run: npm run lint

      # Build UI for production
      - name: Build UI
        working-directory: ui
        run: npm run build

      # Upload UI build artifact
      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: warden-ui-build
          path: ui/dist/
          retention-days: 7

  # ============================================================================
  # UI Docker Image Build and Push
  # ============================================================================
  ui-docker:
    name: Docker UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ui-build]
    
    # Only run on main branch
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      # Download UI build artifact
      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: warden-ui-build
          path: ui/dist/

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/warden-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ui
          file: ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
