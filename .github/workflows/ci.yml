# Intégration continue — étages 1 et 2 de l'ADR-0010.
#
# L'étage 3 (bout en bout : cold start §12 phase 0, egress du runner ADR-0007,
# run tué brutalement §6.4) est DÉLIBÉRÉMENT ABSENT de ce workflow : il exige le
# cluster k3s réel, qui n'est pas joignable depuis un runner GitHub hébergé. Il
# fera l'objet d'un workflow distinct sur runner self-hosted. Le remplacer ici
# par un cluster jetable donnerait des résultats faux — voir l'ADR-0010.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # La version vient de go.mod : une seule source de vérité.
          go-version-file: go.mod

      - name: Formatage
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"; echo "$unformatted"; exit 1
          fi

      - name: go.mod à jour
        run: |
          go mod tidy
          if ! git diff --quiet; then
            echo "go mod tidy produit un diff — committer le résultat :"
            git diff --stat
            exit 1
          fi

      # `go build` est aussi ce qui applique les frontières entre domaines de
      # confiance : un import de `internal/server/internal/...` depuis
      # `internal/runner` est une erreur de compilation (ADR-0011).
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Compilation croisée de la CLI
        # La CLI s'exécute sur la machine de l'utilisateur : elle doit rester
        # portable, et une régression de portabilité doit se voir tout de suite.
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "→ $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/warden
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Ce job tient les arêtes entre rôles serveur de l'ADR-0006, que le
      # compilateur ne couvre PAS : `api`, `gitd`, `controller` et `ingest` sont
      # frères sous le même `internal/`, donc mutuellement visibles. Voir
      # l'en-tête de .golangci.yml.
      #
      # La version est figée : `latest` ferait apparaître des erreurs sur des
      # branches qui n'ont pas bougé, à chaque publication d'un linter.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    name: Tests — étage 1 (unitaire)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Propriété à tenir (ADR-0011) : cet étage ne réclame ni Docker ni
      # cluster. S'il se met à en avoir besoin, c'est qu'un test a glissé
      # d'étage.
      - name: go test
        run: go test -race ./...

  integration:
    name: Tests — étage 2 (intégration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # PostgreSQL vient de testcontainers, pas d'un service déclaré ici : le
      # même chemin de code sert en local et en CI (ADR-0010). Le démon Docker
      # des runners hébergés suffit.
      - name: Binaires envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path)" >> "$GITHUB_ENV"

      - name: go test -tags=integration
        run: go test -race -tags=integration ./...

  web:
    name: Interface — lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Un job à part et non une étape des autres : le front n'a aucune dépendance
    # sur Go, et les mêler ferait attendre un build Angular à qui ne touche que
    # le control plane. Le `paths-filter` viendra quand le temps de CI le
    # justifiera ; à ce stade, un job qui tourne pour rien coûte moins cher qu'un
    # filtre qui laisse passer une régression.
    defaults:
      run:
        working-directory: web/ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La version vient de `.nvmrc` : une seule source de vérité, comme le
          # job Go la lit depuis `go.mod`.
          node-version-file: web/ui/.nvmrc
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      # `ci` et non `install` : il installe EXACTEMENT le lockfile et échoue s'il
      # a dérivé, là où `install` le réécrirait en silence.
      - name: Installation
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Tests
        run: npx ng test --watch=false

      - name: Build de production
        run: npx ng build

  web-image:
    name: Interface — image et en-têtes servis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Un job SÉPARÉ de `web`, et pas une étape de plus : celui-ci n'exerce pas
    # le code mais l'ARTEFACT — le Dockerfile, la configuration nginx et ce que
    # le serveur répond réellement. Deux natures de panne, deux verdicts.
    #
    # Il existe parce que la phase 7 a rendu deux défauts qu'aucune relecture
    # n'avait vus : des en-têtes de sécurité qui disparaissaient sur certains
    # chemins, et un `Cache-Control` émis deux fois. Les deux se voyaient en
    # trente secondes de `curl`, et en aucun temps de lecture.
    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image
        run: docker build -f build/ui.Dockerfile -t warden-ui:ci .

      - name: Démarrage
        run: |
          docker run -d --name ui -p 18080:8080 warden-ui:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:18080/ && exit 0
            sleep 1
          done
          echo "::error::l'interface n'a pas répondu en 30 s"
          docker logs ui
          exit 1

      # LE test du repli SPA. `/runs/01J…` n'a aucun fichier derrière : sans
      # `try_files`, nginx répond 404 et recharger un lien profond casse — donc
      # la fonction première de l'interface, et la raison d'être de
      # `GET /runs/{run_ref}`.
      - name: Un lien profond rechargé sert l'application
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/runs/01JBQ7X4M2K9WPZ3)
          if [ "$code" != "200" ]; then
            echo "::error::lien profond = HTTP $code, attendu 200 (repli SPA rompu)"
            exit 1
          fi

      # `add_header` cesse d'être hérité dès qu'un bloc enfant en déclare UN
      # seul. Poser un `Cache-Control` dans une `location` fait donc tomber
      # silencieusement tous les autres en-têtes. C'est exactement ce qui est
      # arrivé, sur `/index.html` uniquement — d'où la vérification sur CHAQUE
      # chemin plutôt que sur la racine.
      - name: Les en-têtes de sécurité sont sur tous les chemins
        run: |
          echec=0
          for chemin in / /runs/01JBQ7X4M2 /index.html /config.json; do
            entetes=$(curl -sI "http://localhost:18080$chemin")
            for attendu in \
              'X-Content-Type-Options' \
              'X-Frame-Options' \
              'Referrer-Policy' \
              'Cross-Origin-Opener-Policy' \
              'Content-Security-Policy'
            do
              if ! printf '%s' "$entetes" | grep -qi "^$attendu:"; then
                echo "::error::$attendu absent de $chemin"
                echec=1
              fi
            done
          done
          exit $echec

      # Deux valeurs pour une même directive laissent le cache choisir. C'est
      # arrivé sur les assets, où `expires` et un `add_header` en émettaient
      # chacun un.
      - name: Un seul Cache-Control par réponse
        run: |
          asset=$(curl -s http://localhost:18080/ | grep -oE 'main-[A-Za-z0-9]+\.js' | head -1)
          echec=0
          for chemin in / /index.html /config.json "/$asset"; do
            n=$(curl -sI "http://localhost:18080$chemin" | grep -ci '^Cache-Control:')
            if [ "$n" != "1" ]; then
              echo "::error::$chemin porte $n en-têtes Cache-Control, attendu 1"
              echec=1
            fi
          done
          exit $echec

      # `script-src` sans exception est la propriété qui compte : c'est là que
      # l'XSS atterrit. Le build désactive l'inlining du CSS critique pour
      # l'obtenir, et cette optimisation se réactiverait sans bruit.
      - name: script-src ne tolère aucun inline
        run: |
          csp=$(curl -sI http://localhost:18080/ | grep -i '^Content-Security-Policy:')
          if printf '%s' "$csp" | grep -qE "script-src[^;]*unsafe-inline"; then
            echo "::error::script-src tolère 'unsafe-inline'"
            echo "$csp"
            exit 1
          fi
          if printf '%s' "$csp" | grep -qE "script-src[^;]*unsafe-eval"; then
            echo "::error::script-src tolère 'unsafe-eval'"
            exit 1
          fi

      # warden est un control plane : il se déploie en réseau restreint. Une
      # interface qui exige un CDN pour s'afficher n'y rend rien, et le
      # schematic Material remet ces liens à chaque `ng add`.
      - name: Aucune dépendance réseau tierce
        run: |
          if docker run --rm --entrypoint sh warden-ui:ci -c \
             "grep -rlE 'fonts\.(googleapis|gstatic)\.com' /usr/share/nginx/html || true" \
             | grep -q .; then
            echo "::error::le bundle référence un CDN de polices"
            exit 1
          fi

      - name: Arrêt
        if: always()
        run: docker rm -f ui || true

  chart:
    name: Chart — ressources rendues
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Ce job existe pour UNE panne précise et déjà survenue : un `-}}` de trop
    # avant un `---` colle le séparateur à la ligne précédente, les deux
    # documents FUSIONNENT, et la ressource du premier disparaît — écrasée par
    # les clés du second. Rien n'échoue : `helm template` réussit, `helm lint`
    # réussit, et le manifeste produit est du YAML valide. Seule la ressource
    # manque.
    #
    # Elle manquait ici sur l'Ingress du rôle `git`, dès qu'un hôte d'interface
    # était posé — donc sur toute installation servant une UI. Sans Ingress git,
    # aucun `warden push` n'aboutit, et le transport d'audit du produit est mort.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Le routage rendu est celui attendu
        run: python3 build/verif/routage.py

  publish:
    name: Publication des images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Sur `main` SEULEMENT, et après TOUT le reste. Une image publiée est tirée
    # par le déploiement dès qu'elle existe : la publier avant les vérifications
    # ferait de `:dev` un artefact dont personne n'a rien dit.
    #
    # APRÈS `release-cli`, aussi : le serveur 0.0.N annonce sa version, et toute
    # CLI refuse de soumettre tant qu'elle n'est pas en 0.0.N (ADR-0049). Une
    # image publiée sans sa release signée bloquerait donc tous les postes, sans
    # rien à télécharger pour en sortir.
    if: github.ref == 'refs/heads/main'
    needs: [build, lint, test, integration, web, web-image, chart, release-cli]

    # `packages: write` uniquement ici. Le workflow est en `contents: read`, et
    # ce job est le seul qui publie quoi que ce soit.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Le runner hébergé est amd64 : sans QEMU, buildx ne peut émettre que cette
      # seule plateforme, et `make images-push` échouerait sur `linux/arm64`.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Le builder par défaut de Docker (le pilote `docker`) ne sait pas
      # produire de manifeste multi-plateforme ; celui-ci (`docker-container`)
      # sait, et devient le builder que `docker buildx build` utilise ensuite
      # sans rien à lui passer explicitement.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4

      # UNE version par build, et elle est IMMUABLE.
      #
      # Un tag mouvant comme `:dev` n'est jamais retiré par un nœud qui l'a déjà
      # en cache : avec `pullPolicy: IfNotPresent`, republier ne déploie RIEN, et
      # le rollout repart sur l'ancien binaire sans que rien ne le signale.
      #
      # `run_number` croît à chaque exécution du workflow et ne revient jamais en
      # arrière, y compris après un `re-run` — deux builds ne peuvent donc pas se
      # disputer une version.
      - name: Version du build
        run: echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # Les cibles make, et pas des `docker build` recopiés : ce qui est publié
      # doit être ce que `make images` construit en local, sinon les deux
      # dérivent et c'est la CI qui a raison sans que personne le sache.
      #
      # `REGISTRY_OWNER` vient du dépôt : un fork publie chez lui.
      - name: Construction et publication des trois images
        run: |
          make images-push \
            REGISTRY=ghcr.io \
            REGISTRY_OWNER=${{ github.repository_owner }} \
            IMAGE_TAG="$VERSION"

      # Le chart porte la MÊME version, et c'est ce qui tient l'ensemble : son
      # `appVersion` est le tag d'image par défaut, donc un chart tiré en 0.0.N
      # déploie forcément les images 0.0.N. Plus de couple à tenir à la main.
      - name: Publication du chart
        run: |
          helm registry login ghcr.io \
            -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          make chart-push \
            REGISTRY=ghcr.io \
            REGISTRY_OWNER=${{ github.repository_owner }} \
            CHART_VERSION="$VERSION"

      - name: Version publiée
        run: echo "### Publié en \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  release-cli:
    name: Publication de la CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Même porte que `publish` : main seulement, après tout le reste. La CLI est
    # le seul binaire de ce dépôt destiné au poste de l'utilisateur (ADR-0006) —
    # wardend et warden-runner restent des images, tirées par le déploiement, pas
    # des exécutables à télécharger.
    if: github.ref == 'refs/heads/main'
    needs: [build, lint, test, integration, web, web-image, chart]

    # `contents: write` uniquement ici, pour créer la release — le workflow est
    # en lecture seule par défaut, et `publish` n'a besoin que de `packages`.
    permissions:
      contents: write

    # La clé de signature est un secret de l'environnement `release`, et non du
    # dépôt (ADR-0049) : un secret de dépôt est lisible par tout workflow de
    # toute branche, donc par un `ci.yml` modifié sur une branche poussée.
    # L'environnement, lui, n'est ouvert qu'à `main` — réglage côté GitHub,
    # Settings → Environments → release → Deployment branches.
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Même version que les images de ce run (§ job `publish`) : les deux
      # jobs dérivent indépendamment le même calcul depuis `run_number`, qui ne
      # revient jamais en arrière — pas de risque de désaccord entre eux.
      - name: Version du build
        run: echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # Les 5 cibles déjà éprouvées par « Compilation croisée de la CLI » du job
      # `build` — celle-ci les publie, elle ne les découvre pas.
      - name: Compilation croisée
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/warden_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "→ $target"
            # La version inscrite est celle que la CLI compare à celle du
            # serveur (ADR-0049) : sans elle, la release resterait en `dev`.
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-X github.com/jijins1/warden/internal/version.Version=$VERSION" \
              -o "$out" ./cmd/warden
          done

      # UNE signature pour les cinq binaires : celle de leurs sommes (ADR-0049).
      #
      # Le commentaire de confiance `warden v<version>` est couvert par la
      # signature, et la CLI exige qu'il nomme la version demandée : c'est ce
      # qui empêche de servir les sommes signées d'une AUTRE release.
      #
      # La clé est écrite dans le répertoire temporaire du runner, jamais dans
      # `dist/` : `gh release create dist/warden_*` ne la ramasserait pas, mais
      # un glob élargi un jour le ferait.
      - name: Sommes et signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::secret MINISIGN_SECRET_KEY absent : une release non signée ne serait installée par aucune CLI"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          cle="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$cle"
          chmod 600 "$cle"
          (cd dist && sha256sum warden_* > SHA256SUMS)
          minisign -S -s "$cle" -m dist/SHA256SUMS -t "warden v$VERSION"
          rm -f "$cle"

      # Un tag PAR build, immuable comme la version des images : `v0.0.N` ne se
      # republie jamais, et une release GitHub exige un tag pour exister.
      - name: Publication de la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/warden_* dist/SHA256SUMS dist/SHA256SUMS.minisig \
            --title "v$VERSION" \
            --notes "Build continu depuis main, commit ${{ github.sha }}."
