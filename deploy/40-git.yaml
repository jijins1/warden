# Le rôle `git` : détenteur unique du volume des dépôts bare (ADR-0006).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warden-repos
  namespace: warden
spec:
  accessModes: ["ReadWriteOnce"]
  # RWO et non RWX, et c'est la conséquence directe de l'instance unique :
  # l'ADR-0006 assume un point de défaillance unique plutôt qu'un volume partagé
  # dont la cohérence dépendrait du système de fichiers.
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-git
  namespace: warden
spec:
  replicas: 1
  strategy:
    # Recreate et non RollingUpdate : deux instances monteraient le même PVC RWO,
    # et la seconde resterait bloquée au montage pendant que la première tient
    # encore le volume. L'ADR-0006 pose ce redéploiement comme la contrepartie
    # assumée de l'instance unique — pendant l'indisponibilité, aucun run ne
    # démarre.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/component: git
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warden
        app.kubernetes.io/component: git
    spec:
      serviceAccountName: warden-git
      # Ce rôle ne parle jamais à l'API Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup fait appartenir le volume à l'utilisateur du conteneur. SANS
        # LUI, git refuse d'ouvrir les dépôts — « detected dubious ownership »,
        # protection active depuis 2.35.2 — et le symptôme est un HTTP 500 sur
        # chaque push, dont la cause n'apparaît que dans les journaux du pod.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git
          image: gitea.ruokki.ovh/ruokki/wardend:dev
          args: ["git"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WARDEN_GIT_ROOT
              value: /var/lib/warden/repos
            # TROIS ports, et la séparation est un contrôle et non du rangement :
            # elle rend chaque surface restreignable par NetworkPolicy sans
            # changement de code (ADR-0024, ADR-0027).
            - name: WARDEN_GIT_INTERNAL_ADDR   # joignable du seul rôle `api`
              value: ":8081"
            - name: WARDEN_GIT_ADDR            # lecture, joignable des pods runner
              value: ":8083"
            - name: WARDEN_GIT_PUSH_ADDR       # écriture, joignable de la CLI
              value: ":8082"
            - name: WARDEN_GIT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: warden-internal, key: internal-token }
            - name: WARDEN_FORGE_TOKEN
              valueFrom:
                secretKeyRef: { name: warden-internal, key: forge-token }
          ports:
            - { name: internal, containerPort: 8081 }
            - { name: push,     containerPort: 8082 }
            - { name: read,     containerPort: 8083 }
          volumeMounts:
            - { name: repos, mountPath: /var/lib/warden/repos }
            # La racine est en lecture seule ; git écrit des temporaires et le
            # rôle y pose son répertoire de hooks (ADR-0027).
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            tcpSocket: { port: internal }
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket: { port: internal }
            initialDelaySeconds: 10
      volumes:
        - name: repos
          persistentVolumeClaim: { claimName: warden-repos }
        - name: tmp
          emptyDir: {}
---
# Un Service PAR SURFACE, et non un service à trois ports.
#
# C'est ce qui permet à une NetworkPolicy de nommer « le port de lecture » sans
# nommer les deux autres. Les fusionner rendrait la politique inexprimable, ce qui
# est exactement ce que la séparation par port existe pour éviter.
apiVersion: v1
kind: Service
metadata:
  name: warden-git-internal
  namespace: warden
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: git
  ports: [{ name: internal, port: 8081, targetPort: internal }]
---
apiVersion: v1
kind: Service
metadata:
  name: warden-git-read
  namespace: warden
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: git
  ports: [{ name: read, port: 8083, targetPort: read }]
---
apiVersion: v1
kind: Service
metadata:
  name: warden-git-push
  namespace: warden
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: git
  ports: [{ name: push, port: 8082, targetPort: push }]
