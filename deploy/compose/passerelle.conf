events {}

# Les seuls ports de warden que le code d'un playbook peut joindre. Ni l'API
# (8080, et son WARDEN_INSECURE_DEV_AUTH), ni le git interne (8081) : c'est la
# NetworkPolicy de la chart, qu'un réseau Docker ne sait pas poser seul.
stream {
  # L'ordre arrive par un flux long : la borne doit dépasser la durée d'un run.
  proxy_timeout 2h;

  server { listen 8083; proxy_pass git:8083; } # lecture du dépôt
  server { listen 8084; proxy_pass api:8084; } # ordre (dispatch)
  server { listen 8085; proxy_pass api:8085; } # événements (ingest)
}
