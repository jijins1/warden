# Les en-têtes de sécurité de l'UI pour CETTE stack — ceux de l'image
# (build/ui-security-headers.conf), à `connect-src` près.
#
# L'image pose `connect-src 'self'` : elle ne peut pas connaître l'hôte de
# l'API. Ici l'UI est servie sur localhost:4280 et l'API sur localhost:8080,
# deux origines : sans ce fragment, le navigateur bloquerait chaque appel, et
# l'écran de connexion échouerait sans rien dire d'autre qu'une ligne en
# console. `ws://` en plus de `http://` : le flux d'events d'un run est un
# WebSocket, et `connect-src` ne déduit pas l'un de l'autre.
#
# Le reste DOIT rester identique au fragment de l'image : une stack de dev qui
# relâche la CSP cacherait ce qu'elle bloquera en production.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 ws://localhost:8080; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
