# Le rôle `controller` : la marche 3 de la machine à états du §6.4.
#
# Sans lui, un run dont le pod est évincé, tué par l'OOM ou emporté avec son nœud
# reste « en cours » pour toujours — et le produit MENT sur ce qu'il a fait. C'est
# aussi lui qui ramasse les pods terminés (§8.7), faute de quoi ils s'accumulent
# dans le namespace.
#
# Son propre ServiceAccount, et pas celui du rôle `api` : il n'a besoin ni de
# CRÉER un pod ni de lire un Secret. Réutiliser `warden-api` lui donnerait le
# droit de lancer des runs, ce dont il n'a aucun usage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden-controller
  namespace: warden-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-controller
  namespace: warden-dev
rules:
  # Observer les pods runner, et supprimer ceux dont plus aucun run n'a besoin.
  #
  # Pas de `create` : ce n'est pas lui qui lance. Pas de `watch` non plus — le
  # contrôleur liste périodiquement, et un droit accordé « pour plus tard » est un
  # droit que personne ne retire. Il s'ajoutera avec l'informer.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]

  # `delete` SEUL sur les Secrets, et c'est la permission la plus étroite qui
  # fait le travail : supprimer un pod supprime aussi le Secret qui porte son
  # jeton d'amorçage, parce qu'un rattachement raté au lancement l'aurait laissé
  # orphelin (ADR-0023). Sans `get` ni `list`, le contrôleur ne peut LIRE aucun
  # jeton — il ne peut que faire disparaître ceux dont le pod est mort.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-controller
  namespace: warden-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warden-controller
subjects:
  - kind: ServiceAccount
    name: warden-controller
    namespace: warden-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-controller
  namespace: warden-dev
spec:
  # UN seul réplica. L'ADR-0006 prévoit la leader election par Lease ; elle
  # n'existe pas encore et elle ne changerait rien à la correction — la clôture
  # est gardée par `ended_at IS NULL` et le ramassage ne touche que des pods déjà
  # terminés, donc deux contrôleurs feraient du travail en double, pas du travail
  # faux. Ce `1` est ce qui rend le doublon inutile en attendant.
  replicas: 1
  strategy:
    # Recreate et non RollingUpdate : pendant une mise à jour, deux contrôleurs
    # coexisteraient. C'est inoffensif, mais l'inoffensif repose ici sur une
    # garde SQL, et rien ne gagne à l'éprouver à chaque déploiement.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warden
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: warden-controller
      volumes:
        # Le document des droits (ADR-0033), versionné dans `56-droits.yaml`.
        #
        # Monté ICI et pas dans `api` : le contrôleur est le rôle dont le métier
        # est de faire correspondre la base à ce que le monde extérieur dit, et
        # il tourne à UN réplica. Dans `api`, qui peut en avoir N, ce serait N
        # réconciliateurs sur le même document.
        - name: grants
          configMap:
            name: warden-grants
            # Facultatif : un contrôleur démarré avant que le ConfigMap existe
            # doit tourner, pas rester bloqué au montage. Le code traite
            # l'absence du fichier comme « ne rien faire » — surtout pas comme un
            # document vide, qui révoquerait tous les droits du produit.
            optional: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: gitea.ruokki.ovh/ruokki/wardend:dev
          args: ["controller"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WARDEN_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: warden-db-app, key: uri }
            - name: WARDEN_POD_NAMESPACE
              value: warden-dev
            - name: WARDEN_GRANTS_FILE
              value: /etc/warden/grants.yaml
          volumeMounts:
            - name: grants
              mountPath: /etc/warden
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }

          # AUCUN port, donc aucune sonde TCP. Le contrôleur ne sert rien : rien
          # ne doit pouvoir le solliciter de l'extérieur, et il n'a rien à
          # répondre à personne. Un port ouvert « pour la sonde » serait une
          # surface ajoutée en échange de rien.
---
# Rien ne joint le contrôleur, et il ne joint que la base et l'API Kubernetes.
#
# Il n'a PAS d'egress ouvert, contrairement aux pods runner : il n'exécute aucun
# code d'utilisateur. L'ingress vide dit ce que la ligne au-dessus affirme.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-controller
  namespace: warden-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/component: controller
  policyTypes: ["Ingress"]
  ingress: []
