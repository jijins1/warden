# Le rôle `api` : l'API d'audit, et le canal de dispatch vers les pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-api
  namespace: warden-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warden
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: warden-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gitea.ruokki.ovh/ruokki/wardend:dev
          args: ["api"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WARDEN_DATABASE_URL
              valueFrom:
                # CNPG publie la chaîne de connexion complète. La recomposer à
                # partir de l'hôte, du port et du mot de passe ajouterait un
                # endroit où elle peut être fausse.
                secretKeyRef: { name: warden-db-app, key: uri }
            - name: WARDEN_API_ADDR
              value: ":8080"
            - name: WARDEN_DISPATCH_ADDR
              value: ":8084"
            - name: WARDEN_INGEST_ADDR
              value: ":8085"

            # PAS de WARDEN_INGEST_DATABASE_URL : le rôle PostgreSQL restreint
            # de l'ADR-0008 n'a pas d'utilisateur de connexion dans ce
            # déploiement, et l'ingestion retombe donc sur le DSN applicatif en
            # le disant au démarrage. C'est un écart ASSUMÉ du déploiement de
            # développement, pas du code : le jour où CNPG publie un second
            # secret, cette variable le pointe et rien d'autre ne bouge.

            # PAS de WARDEN_INSECURE_DEV_AUTH, et c'est le changement qui
            # compte : `warden login` existe, donc l'en-tête « je suis alice »
            # n'a plus de raison d'être accepté. Le poser vaudrait ACCEPTER que
            # n'importe quel appelant se déclare n'importe qui — y compris
            # administrateur.
            #
            # Il reste dans le code pour les tests de bout en bout, qui n'ont
            # pas de terminal pour saisir un mot de passe.
            #
            # Amorçage du premier compte, une fois, depuis le cluster :
            #   kubectl exec deploy/warden-api -- \
            #     wardend user add --subject alice --admin
            # Son autorisation est l'accès à la base, pas un mot de passe : c'est
            # la seule qui existe avant qu'un compte existe.

            # Validité d'une session `warden login`, en HEURES. Absente, le
            # défaut du cœur s'applique — trente jours. Le curseur est mis du
            # côté de l'usage parce que la révocation existe : `warden logout`,
            # la désactivation d'un compte et le changement de mot de passe
            # coupent toutes les sessions immédiatement.
            - name: WARDEN_SESSION_TTL_HOURS
              value: "720"

            - name: WARDEN_GIT_INTERNAL_URL
              value: http://warden-git-internal:8081
            - name: WARDEN_GIT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: warden-internal, key: internal-token }

            # DEUX adresses que le produit ne joint pas lui-même : ce sont celles
            # qu'il REMET au pod. Le pod n'est pas dans le même espace réseau que
            # le processus qui sert, et confondre les deux fait démarrer des pods
            # qui ne savent pas qui appeler.
            # La BASE, sans nom de dépôt : un dépôt bare par dépôt (ADR-0006),
            # donc l'origine dépend du run et se compose côté serveur.
            - name: WARDEN_GIT_RUNNER_URL
              value: http://warden-git-read:8083
            - name: WARDEN_DISPATCH_RUNNER_URL
              value: http://warden-dispatch:8084
            - name: WARDEN_INGEST_RUNNER_URL
              value: http://warden-ingest:8085

            - name: WARDEN_POD_NAMESPACE
              value: warden-dev
            - name: WARDEN_RUNNER_IMAGE
              value: gitea.ruokki.ovh/ruokki/warden-runner:dev

            # Le plafond de durée d'un run, en SECONDES (décision actée n°13).
            # Il devient `activeDeadlineSeconds` sur le pod, donc il arrête un
            # run qui pend même si le contrôleur est mort — la seule protection
            # qui ne dépend d'aucun de nos processus.
            #
            # Ce n'est PAS lui qui écrit la cause : le pod passe à
            # `reason: DeadlineExceeded`, le runner s'abstient de conclure, et le
            # rôle `controller` inscrit `interrupted / server_task_timeout`.
            # Sans le contrôleur déployé, un run arrêté ainsi reste en vol.
            - name: WARDEN_RUN_DEADLINE_SECONDS
              value: "7200"
          ports:
            - { name: api,      containerPort: 8080 }
            - { name: dispatch, containerPort: 8084 }
            - { name: ingest,   containerPort: 8085 }
          readinessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: warden-api
  namespace: warden-dev
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: api
  ports: [{ name: api, port: 8080, targetPort: api }]
---
# Le canal de dispatch a son PROPRE service, pour la même raison que le rôle
# `git` a trois : c'est la seule surface qui distribue des credentials, et la
# séparer par le port la rend restreignable sans changement de code (ADR-0018).
apiVersion: v1
kind: Service
metadata:
  name: warden-dispatch
  namespace: warden-dev
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: api
  ports: [{ name: dispatch, port: 8084, targetPort: dispatch }]
---
# L'ingestion a son propre service pour la même raison, et une de plus : quand
# l'ADR-0007 dit que le runner ne joint jamais l'API, cela se lit « jamais le
# PORT de l'API ». C'est ici que la phrase devient exprimable en NetworkPolicy.
#
# Le rôle `ingest` existe déjà dans le binaire et n'est pas déployé : `api` sert
# le même endpoint sur ce même port. Le promouvoir en Deployment séparé ne
# demandera que d'ajouter un manifeste pointant ce Service ailleurs.
apiVersion: v1
kind: Service
metadata:
  name: warden-ingest
  namespace: warden-dev
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: api
  ports: [{ name: ingest, port: 8085, targetPort: ingest }]
---
# Les migrations : un Job, pas un initContainer.
#
# L'ADR-0012 le pose — ce n'est pas un rôle, c'est quelque chose qui s'exécute et
# se termine. En initContainer, il tournerait à CHAQUE démarrage de pod et
# sérialiserait les redémarrages derrière une migration.
apiVersion: batch/v1
kind: Job
metadata:
  name: warden-migrate
  namespace: warden-dev
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: gitea.ruokki.ovh/ruokki/wardend:dev
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: WARDEN_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: warden-db-app, key: uri }
