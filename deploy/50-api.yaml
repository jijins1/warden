# Le rôle `api` : l'API d'audit, et le canal de dispatch vers les pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-api
  namespace: warden-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warden
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: warden-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gitea.ruokki.ovh/ruokki/wardend:dev
          args: ["api"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WARDEN_DATABASE_URL
              valueFrom:
                # CNPG publie la chaîne de connexion complète. La recomposer à
                # partir de l'hôte, du port et du mot de passe ajouterait un
                # endroit où elle peut être fausse.
                secretKeyRef: { name: warden-db-app, key: uri }
            - name: WARDEN_API_ADDR
              value: ":8080"
            - name: WARDEN_DISPATCH_ADDR
              value: ":8084"

            # L'authentification RÉELLE n'existe pas (OIDC/mTLS restent à faire).
            # Sans cet opt-in, le middleware refuse TOUTE requête — et c'est la
            # bonne posture : un produit d'audit qui accepterait « je suis alice »
            # en silence serait pire qu'un produit qui refuse de répondre.
            #
            # Le poser vaut ACCEPTER que n'importe quel appelant se déclare
            # n'importe qui. Acceptable pour un déploiement `dev`, jamais ailleurs.
            - name: WARDEN_INSECURE_DEV_AUTH
              value: "1"

            - name: WARDEN_GIT_INTERNAL_URL
              value: http://warden-git-internal:8081
            - name: WARDEN_GIT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: warden-internal, key: internal-token }

            # DEUX adresses que le produit ne joint pas lui-même : ce sont celles
            # qu'il REMET au pod. Le pod n'est pas dans le même espace réseau que
            # le processus qui sert, et confondre les deux fait démarrer des pods
            # qui ne savent pas qui appeler.
            # La BASE, sans nom de dépôt : un dépôt bare par dépôt (ADR-0006),
            # donc l'origine dépend du run et se compose côté serveur.
            - name: WARDEN_GIT_RUNNER_URL
              value: http://warden-git-read:8083
            - name: WARDEN_DISPATCH_RUNNER_URL
              value: http://warden-dispatch:8084

            - name: WARDEN_POD_NAMESPACE
              value: warden-dev
            - name: WARDEN_RUNNER_IMAGE
              value: gitea.ruokki.ovh/ruokki/warden-runner:dev
          ports:
            - { name: api,      containerPort: 8080 }
            - { name: dispatch, containerPort: 8084 }
          readinessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: warden-api
  namespace: warden-dev
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: api
  ports: [{ name: api, port: 8080, targetPort: api }]
---
# Le canal de dispatch a son PROPRE service, pour la même raison que le rôle
# `git` a trois : c'est la seule surface qui distribue des credentials, et la
# séparer par le port la rend restreignable sans changement de code (ADR-0018).
apiVersion: v1
kind: Service
metadata:
  name: warden-dispatch
  namespace: warden-dev
spec:
  selector:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: api
  ports: [{ name: dispatch, port: 8084, targetPort: dispatch }]
---
# Les migrations : un Job, pas un initContainer.
#
# L'ADR-0012 le pose — ce n'est pas un rôle, c'est quelque chose qui s'exécute et
# se termine. En initContainer, il tournerait à CHAQUE démarrage de pod et
# sérialiserait les redémarrages derrière une migration.
apiVersion: batch/v1
kind: Job
metadata:
  name: warden-migrate
  namespace: warden-dev
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: gitea.ruokki.ovh/ruokki/wardend:dev
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: WARDEN_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: warden-db-app, key: uri }
