# Les droits par environnement (§10.2, ADR-0033).
#
# CE FICHIER EST LA SOURCE DE VÉRITÉ. Aucune commande du produit ne modifie les
# droits : `warden grant list` les affiche, rien ne les écrit. La seule façon
# d'en changer est de committer ici et de laisser l'outil GitOps synchroniser.
#
# Le rôle `controller` relit le ConfigMap monté à chaque passage (30 s) et
# réconcilie la base dessus. Un kubelet met quelques dizaines de secondes à
# republier un ConfigMap modifié, donc compter environ une minute entre le sync
# et l'effet.
#
# ---------------------------------------------------------------------------
# CE QUE CE CONTRÔLE ACHÈTE, ET CE QU'IL N'ACHÈTE PAS
#
#   ARRÊTE       : obtenir la clé SSH d'un environnement auquel on n'a pas
#                  droit. Sans droit, aucun credential, donc aucune machine
#                  joignable.
#
#   N'ARRÊTE PAS : qu'un run légitime de `staging` joigne une machine de `prod`.
#                  L'egress du runner est ouvert (ADR-0030), et le §10.2 pose que
#                  « le périmètre d'un utilisateur est appliqué par le réseau ou
#                  il ne l'est pas ».
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: warden-grants
  namespace: warden-dev
data:
  # Pour chaque environnement NOMMÉ ici, la liste fait autorité : un compte
  # retiré du fichier est RÉVOQUÉ au passage suivant. C'est le point — sans
  # cela, le versionnement ne servirait qu'à consigner ce qu'on ajoute.
  #
  # Un environnement ABSENT de ce document n'est PAS touché. Deux conséquences
  # voulues : les droits peuvent se découper en plusieurs ConfigMaps, et un
  # fichier tronqué laisse intacts les environnements qu'il a perdus au lieu de
  # tout révoquer. La contrepartie est réelle — supprimer un bloc entier ne
  # révoque rien — et `warden grant list` reste la seule vue complète.
  #
  # Un document VIDE est REFUSÉ, et journalisé en erreur : « ne rien vouloir » et
  # « n'avoir rien pu lire » se ressemblent trop. Pour fermer un environnement,
  # écrire une liste vide — c'est un « personne » explicite.
  #
  # Les comptes doivent EXISTER. Une faute de frappe fait échouer le document
  # entier plutôt que de retirer des accès sans en donner aucun ; l'erreur sort
  # dans les journaux du contrôleur.
  grants.yaml: |
    environments:
      prod:
        - ruokki
