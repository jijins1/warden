# MODÈLE — à ne pas appliquer tel quel.
#
# Ces valeurs sont des secrets réels en production. Elles figurent ici pour dire
# QUELLES clés existent et à quoi elles servent, pas pour être déployées : un
# secret dans un dépôt git est un secret publié.
#
# En pratique : `kubectl create secret generic ... --from-literal=...`, ou un
# gestionnaire externe. L'ADR-0020 a constaté que l'environnement cible n'a pas de
# gestionnaire de secrets, et que la rotation reste le seul mécanisme de
# révocation.
apiVersion: v1
kind: Secret
metadata:
  name: warden-internal
  namespace: warden-dev
type: Opaque
stringData:
  # Partagé par les rôles `api` et `git` (ADR-0024). Il authentifie l'API interne
  # ET signe les jetons de push et de lecture (ADR-0028) : qui le détient peut
  # frapper une portée arbitraire. Son rayon de souffle est le rôle `git` entier.
  #
  # 256 bits d'aléa : `openssl rand -base64 32`
  internal-token: "REMPLACER-PAR-UN-ALEA-DE-256-BITS"

  # Lecture sur la forge, pour le rafraîchissement du miroir de la branche
  # protégée (ADR-0028). Un seul credential pour tout le déploiement en v1 : un
  # dépôt privé par équipe en exigera un par dépôt.
  forge-token: "REMPLACER-PAR-UN-JETON-DE-LECTURE"
